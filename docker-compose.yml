services:
  # SentinelFlow AI FastAPI Backend & Policy Decision Agent
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./data/sentinelflow.db
      - STRANDS_DECIDER_URL=http://strands-decider:8099
      - STRANDS_DECIDER_MODEL=StrandsAgents/strands-decider-2B-qwen3.5-v1-2610
      - CONFIDENCE_THRESHOLD=0.80
      - AWS_REGION=us-east-1
      - BEDROCK_MODEL_ID=anthropic.claude-3-5-sonnet-20241022-v2:0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentinelflow-net

  # Next.js SecOps Cybersecurity Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - sentinelflow-net

networks:
  sentinelflow-net:
    driver: bridge
